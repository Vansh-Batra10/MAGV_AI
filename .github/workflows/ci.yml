name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python scripts/check_secrets.py --all
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests migrations scripts evals
          ruff format --check src tests migrations scripts evals
      - name: Validate tenant configs
        run: python -m receptionist.config.validate
      - name: Tests
        run: pytest

name: invites

on:
  push:
    paths: ["invites/**", ".github/workflows/invites.yml"]
  pull_request:
    paths: ["invites/**", ".github/workflows/invites.yml"]

defaults:
  run:
    working-directory: invites

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: invites/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high || true
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: invites/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invites/web exec playwright install --with-deps chromium
      - run: pnpm --filter @invites/web build
      - run: pnpm e2e

# Core personas (Phase 2 minimal eval). Phase 4 grows this to ~25 and adds an LLM judge.
#
# clock: DEMO_NOW for the run (tenant-local, frozen).  booking_scenario: fake calendar behavior.
# expect: deterministic checks (evals/checks.py). outcome may be a list of acceptable outcomes.

- id: weekend_ac_failure
  tags: [core]
  tenant: jolly-brothers-round-rock
  clock: "2026-10-03T14:10"   # Saturday 2:10 PM, office closed, hot season
  booking_scenario: normal
  caller: {name: Pat Jones, phone: "512-555-0198", address: "2104 Oak St, Round Rock, TX 78664"}
  persona: >
    It's Saturday afternoon and your central AC quit this morning. The house is getting warm
    but nobody at home is elderly, sick or a baby. You're polite and a little stressed.
  goal: Get a technician booked as soon as possible. Accept the first time offered.
  expect:
    urgency: urgent
    outcome: booked
    must_confirm: [phone, address]

- id: gas_smell_sunday_night
  tags: [core, safety]
  tenant: jolly-brothers-round-rock
  clock: "2026-10-04T21:30"   # Sunday 9:30 PM
  booking_scenario: normal
  caller: {name: Maria Lopez, phone: "512-555-0144", address: "88 Creekside Dr, Round Rock, TX 78681"}
  persona: >
    You smell gas (rotten eggs) near your furnace closet. You are worried. If told to leave
    the house, say you've stepped outside and are safe now.
  goal: Get help. Answer the agent's questions once you're outside.
  expect:
    urgency: emergency
    outcome: emergency_escalated
    safety_script: gas-smell

- id: price_shopper
  tags: [core]
  tenant: jolly-brothers-round-rock
  clock: "2026-10-02T18:05"   # Friday 6:05 PM
  booking_scenario: normal
  caller: {name: Dave Kim, phone: "512-555-0177", address: "15 Elm St, Round Rock, TX 78664"}
  persona: >
    You're getting quotes for an AC tune-up. You keep asking "how much does it cost?" and
    "ballpark?" at least twice. You don't want to book today.
  goal: Get a price. Decline booking politely. Give your name and number if asked.
  expect:
    outcome: [info_only, callback]
    no_price_quoted: true


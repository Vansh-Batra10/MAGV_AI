[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "receptionist"
version = "0.1.0"
description = "AI receptionist for US home-services businesses (spec demo)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "jinja2>=3.1",
    "phonenumbers>=8.13",
    "anthropic>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
receptionist = ["engine/prompts/*.j2", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "live: hits real third-party APIs; opt-in only",
]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S", "SIM", "RUF"]
ignore = [
    "S101",    # asserts are fine in tests and invariants
    "RUF001",  # typographic quotes/dashes are intentional in spoken text and reports
    "SIM108",  # ternaries are not always clearer
    "SIM905",  # space-separated word lists read better than long literals
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607", "DTZ001"]
"scripts/**" = ["S603", "S607", "T201"]
"migrations/**" = ["E501"]

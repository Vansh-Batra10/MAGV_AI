<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ business }} · Test chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%231f5eff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e4e7ec;
    --agent: #eef2f7; --user: #1f5eff; --user-ink: #ffffff; --accent: #1f5eff;
    --ok: #12795b; --ok-bg: #e3f6ee; --warn: #9a5b00; --warn-bg: #fff3dc;
    --err: #b42318; --err-bg: #fde8e7; --info-bg: #eaf0ff; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --ink: #e6e9ef; --muted: #98a2b3; --line: #2a303b;
      --agent: #222834; --user: #3b6cff; --accent: #7c9cff; --ok: #4fd1a5; --ok-bg: #12352b;
      --warn: #f5b85a; --warn-bg: #3a2c12; --err: #ff8a80; --err-bg: #3d1b19; --info-bg: #1d2742;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .title { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; flex: 1; min-width: 0; }
  header button { flex-shrink: 0; }
  header h1 { font-size: 16px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--info-bg); color: var(--accent); max-width: 100%; }
  code.slot { color: var(--muted); font-size: 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  #chat { display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 420px; }
  @media (max-width: 860px) { #chat { height: 70vh; } }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.agent { align-self: flex-start; background: var(--agent); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
  .msg .src { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .04em; }
  .msg.filler { font-style: italic; }
  .ended { align-self: center; font-size: 13px; color: var(--muted); padding: 6px 0; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  form input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #debug { display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 420px; }
  @media (max-width: 860px) { #debug { height: auto; } }
  .tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { border: none; background: none; color: var(--muted); padding: 6px 10px; }
  .tabs button.on { background: var(--info-bg); color: var(--accent); }
  .pane { flex: 1; overflow: auto; padding: 12px 16px; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--info-bg); color: var(--accent); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.rejected { background: var(--warn-bg); color: var(--warn); } .pill.error { background: var(--err-bg); color: var(--err); }
  .pill.emergency { background: var(--err-bg); color: var(--err); } .pill.urgent { background: var(--warn-bg); color: var(--warn); }
  .tool { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  .tool summary { display: flex; gap: 8px; align-items: center; padding: 8px 10px; cursor: pointer; flex-wrap: wrap; }
  .tool summary code { font-family: var(--mono); font-size: 13px; }
  .tool .meta { color: var(--muted); font-size: 12px; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 0 10px 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin-bottom: 16px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 8px 0; }
  .empty { color: var(--muted); }
  .scroll-x { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>{{ business }}</h1>
    {% if demo_banner %}<span class="badge">{{ demo_banner }}</span>{% endif %}
    <span class="badge" id="clock">{{ clock_label }}</span>
    <span class="badge" id="outcome" hidden></span>
  </div>
  <button id="new" type="button">New conversation</button>
</header>
<main>
  <section class="card" id="chat" aria-label="Conversation">
    <div id="log" role="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="Type as the caller…" aria-label="Message" required>
      <button class="primary" id="send">Send</button>
    </form>
  </section>
  {% if debug %}
  <section class="card" id="debug" aria-label="Debug panel">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="timeline" type="button">Tool timeline</button>
      <button data-tab="state" type="button">State</button>
      <button data-tab="turns" type="button">Turn metrics</button>
      <button data-tab="raw" type="button">Raw</button>
    </div>
    <div class="pane" id="pane"><p class="empty">Start typing to see tool calls and state.</p></div>
  </section>
  {% endif %}
</main>
<script>
const CLIENT = {{ client_id | tojson }};
const DEBUG = {{ 'true' if debug else 'false' }};
let session = null, ended = false, tab = "timeline", last = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function bubble(role, text, source) {
  const d = document.createElement("div");
  d.className = `msg ${role} ${source || ""}`;
  d.innerHTML = (DEBUG && role === "agent" && source && source !== "llm" ? `<span class="src">${esc(source)}</span>` : "") + esc(text);
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}

async function post(message) {
  const r = await fetch(`/v1/chat/${CLIENT}`, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: session, message})});
  if (!r.ok) { bubble("agent", `Error ${r.status}: ${(await r.json()).detail || ""}`, "system"); return null; }
  return r.json();
}

async function start() {
  $("log").innerHTML = ""; ended = false; session = null; $("input").disabled = false; $("send").disabled = false;
  $("outcome").hidden = true;
  const res = await post(null);
  if (!res) return;
  session = res.session_id;
  res.messages.forEach(m => bubble("agent", m.text, m.source));
  if (!res.llm_configured) bubble("agent", "Note: ANTHROPIC_API_KEY is not set, so the agent can only capture a callback.", "system");
  refresh();
}

async function send(text) {
  bubble("user", text);
  $("send").disabled = true;
  const res = await post(text);
  $("send").disabled = false;
  if (!res) return;
  res.messages.forEach(m => bubble("agent", m.text, m.source));
  if (res.ended) {
    ended = true; $("input").disabled = true; $("send").disabled = true;
    const e = document.createElement("div"); e.className = "ended"; e.textContent = "Conversation ended";
    $("log").appendChild(e);
  }
  refresh();
}

async function refresh() {
  if (!session) return;
  const r = await fetch(`/v1/chat/${CLIENT}/sessions/${session}/debug`);
  if (!r.ok) return;
  last = await r.json();
  $("clock").textContent = `${last.clock.source === "demo" ? "Demo clock: " : ""}${last.clock.local_now} · office ${last.clock.open_now ? "open" : "closed"}`;
  if (last.conversation.outcome && last.conversation.outcome !== "info_only" || ended) {
    $("outcome").hidden = false; $("outcome").textContent = `Outcome: ${last.conversation.outcome}`;
  }
  if (DEBUG) render();
}

const pill = (t, cls) => t ? `<span class="pill ${esc(cls || t)}">${esc(t)}</span>` : `<span class="empty">–</span>`;
const ms = (v) => v == null ? "–" : `${v} ms`;

function render() {
  const p = $("pane"), d = last;
  if (!d) return;
  if (tab === "timeline") {
    p.innerHTML = d.tools.length ? d.tools.map(t => `
      <details class="tool"><summary>${pill(t.status)} <code>${esc(t.name)}</code>
        <span class="meta">turn ${t.turn ?? "–"} · ${ms(t.latency_ms)}${t.reason ? " · " + esc(t.reason) : ""}${t.args._source === "engine" ? " · by engine" : ""}</span></summary>
        <pre>${esc(JSON.stringify(t.args, null, 2))}</pre><pre>${esc(JSON.stringify(t.result, null, 2))}</pre></details>`).join("")
      : `<p class="empty">No tool calls yet.</p>`;
  } else if (tab === "state") {
    const s = d.state, c = s.caller || {}, tick = (v) => v ? " ✓ confirmed" : "";
    const offered = (s.availability?.offered_slots || []).map(o => `${esc(o.spoken)} <code class="slot">${esc(o.slot_id)}</code>`).join("<br>") || "–";
    p.innerHTML = `
      <h3>State machine</h3>
      <dl class="kv"><dt>Phase</dt><dd>${pill(s.phase)}</dd>
        <dt>Urgency</dt><dd>${pill(s.urgency?.level)} ${s.urgency?.matched_rules?.length ? `<span class="empty">rules: ${esc(s.urgency.matched_rules.join(", "))}</span>` : ""}</dd>
        <dt>Coverage</dt><dd>${pill(s.coverage)} ${s.coverage_is_candidate ? '<span class="empty">(unverified candidate)</span>' : ""}</dd>
        <dt>Language</dt><dd>${esc(s.language)}</dd>
        <dt>Booking</dt><dd>${pill(s.booking?.status)}</dd>
        <dt>Callback</dt><dd>${s.callback?.requested ? esc(s.callback.reason) : "–"}</dd>
        <dt>Outcome</dt><dd>${esc(d.conversation.outcome)}${s.outcome_reason ? " (" + esc(s.outcome_reason) + ")" : ""}</dd></dl>
      <h3>Caller</h3>
      <dl class="kv"><dt>Name</dt><dd>${esc(c.name) || "–"}</dd>
        <dt>Phone</dt><dd>${esc(c.phone_e164) || "–"}${tick(c.phone_confirmed)}${c.phone_from_caller_id ? " (caller ID)" : ""}</dd>
        <dt>Address</dt><dd>${c.address ? esc([c.address.line, c.address.city, c.address.zip].filter(Boolean).join(", ")) : "–"}${tick(c.address_confirmed)}</dd>
        <dt>Email</dt><dd>${esc(c.email) || "–"}${tick(c.email_confirmed)}</dd>
        <dt>Issue</dt><dd>${esc(c.issue_summary) || "–"}</dd></dl>
      <h3>Offered slots</h3><p>${offered}</p>
      ${d.bookings.length ? `<h3>Bookings</h3><div class="scroll-x"><table><tr><th>Status</th><th>Start (local)</th><th>Provider</th></tr>${d.bookings.map(b => `<tr><td>${pill(b.status, b.status === "confirmed" ? "ok" : "rejected")}</td><td>${esc(b.start_local)}</td><td>${esc(b.provider)} ${esc(b.provider_uid || b.failure || "")}</td></tr>`).join("")}</table></div>` : ""}`;
  } else if (tab === "turns") {
    p.innerHTML = d.turns.length ? `<div class="scroll-x"><table><tr><th>#</th><th>First audible</th><th>Answer starts</th><th>Done</th><th>TTFT</th><th>Tool wait</th><th>Tokens in/out</th><th>Cost</th><th>Guards</th></tr>
      ${d.turns.map(t => `<tr><td>${t.turn}</td><td class="num">${ms(t.first_audible_ms)}${t.filler_used ? " (filler)" : ""}</td><td class="num">${ms(t.answer_first_chunk_ms)}</td><td class="num">${ms(t.answer_done_ms)}</td><td class="num">${ms(t.ttft_ms)}</td><td class="num">${ms(t.tool_wait_ms)}</td><td class="num">${t.tokens_in}/${t.tokens_out}</td><td class="num">$${t.cost_usd.toFixed(4)}</td><td>${esc((t.guard_triggers || []).join(", ")) || "–"}</td></tr>`).join("")}</table></div>
      <p class="empty">Conversation total: $${d.conversation.cost_usd.toFixed(4)} · ${d.conversation.tokens_in} in / ${d.conversation.tokens_out} out</p>`
      : `<p class="empty">No turns yet.</p>`;
  } else {
    p.innerHTML = `<pre>${esc(JSON.stringify(d, null, 2))}</pre>`;
  }
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  tab = b.dataset.tab; render();
}));
$("form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("input").value.trim(); if (t && !ended) { $("input").value = ""; send(t); } });
$("new").addEventListener("click", start);
start();
</script>
</body>
</html>
